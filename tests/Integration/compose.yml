# The real panel image with MariaDB, started by run.sh. Nothing is published to the host, and mock-wings.php replaces Wings.
name: pelican-provisioner-integration

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: panel
      MARIADB_USER: pelican
      MARIADB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?set by run.sh}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  panel:
    image: ghcr.io/pelican/panel:v1.0.0-rc.2
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pelican-data:/pelican-data
    environment:
      XDG_DATA_HOME: /pelican-data
      APP_URL: http://panel
      APP_ENV: production
      APP_DEBUG: "false"
      APP_INSTALLED: "true"
      ADMIN_EMAIL: admin@integration.test
      BEHIND_PROXY: "true"
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pelican
      DB_PASSWORD: ${INTEGRATION_DB_PASSWORD:?set by run.sh}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

volumes:
  pelican-data:
