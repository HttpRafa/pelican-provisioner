name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  checks:
    name: 🧪 Checks
    uses: ./.github/workflows/checks.yml

  release:
    name: 📦 Publish
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ⬇️ Checkout Code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          extensions: zip

      - name: 🔎 Check the tag matches plugin.json
        run: test "$GITHUB_REF_NAME" = "v$(jq -r .version plugin.json)"

      - name: 📦 Install dependencies
        run: composer install --no-interaction --no-dev --prefer-dist

      - name: 📦 Build the plugin archive
        run: php scripts/build-zip.php

      - name: 📝 Write the update manifest
        run: php scripts/write-update-json.php

      - name: 🚀 Publish the release
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/update.json --verify-tag --notes-file dist/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
